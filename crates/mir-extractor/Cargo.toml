[package]
name = "mir-extractor"
version = "0.1.0"
edition = "2021"
# Required to link against rustc internal libraries (rustc-dev component).
# The #![feature(rustc_private)] attribute in main.rs enables the feature.

[package.metadata.rust-analyzer]
# Allow rust-analyzer to resolve rustc_private crates (rustc-dev component).
rustc_private = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
